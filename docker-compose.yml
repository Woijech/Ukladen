name: ukladen

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-backend: &backend
  image: ukladen-backend:local
  build: ./apps/backend
  env_file: .env
  environment: &backend-environment
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?Set POSTGRES_USER}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
    REDIS_URL: redis://redis:6379/0
    S3_ENDPOINT: http://seaweedfs:8333
  init: true
  restart: unless-stopped
  logging: *logging

services:
  postgres:
    logging: *logging
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
    ports: ["127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    logging: *logging
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  seaweedfs:
    logging: *logging
    image: chrislusf/seaweedfs:4.48
    user: seaweed
    command: mini -dir=/data -s3.port=8333 -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:?Set S3_BUCKET}
      WEED_ADMIN_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      WEED_ADMIN_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
    ports: ["127.0.0.1:8333:8333", "127.0.0.1:23646:23646"]
    volumes: ["seaweedfs-data:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *backend
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      seaweedfs: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health/ready', timeout=12)"]
      interval: 15s
      timeout: 13s
      retries: 5

  worker:
    <<: *backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --concurrency=2
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 5

  beat:
    <<: *backend
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      api: { condition: service_healthy }

  material-worker:
    <<: *backend
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=materials --concurrency=1 --prefetch-multiplier=1
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app:celery_app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 10s
      retries: 5

  ai-document-worker:
    <<: *backend
    profiles: [ai]
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=ai-documents --concurrency=1 --prefetch-multiplier=1
    depends_on:
      api: { condition: service_healthy }

  embedding-worker:
    <<: *backend
    image: ukladen-backend:embeddings
    build:
      context: ./apps/backend
      target: embeddings
    profiles: [embeddings]
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=embeddings --concurrency=1 --prefetch-multiplier=1
    environment:
      <<: *backend-environment
      SEARCH_EMBEDDINGS_DIRECTORY: /model
      AI_ENABLED: "false"
      AI_ACTIONS_ENABLED: "false"
      AI_RETENTION_ENABLED: "false"
      AI_REVIEWS_ENABLED: "false"
      AI_CONNECTIONS_FILE: null
    volumes:
      - ${SEARCH_EMBEDDINGS_DIRECTORY:-./.local/embedding-model}:/model:ro,z
    mem_limit: 2g
    depends_on:
      api: { condition: service_healthy }

  web:
    logging: *logging
    image: ukladen-web:local
    build: ./apps/web
    init: true
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  traefik:
    logging: *logging
    image: traefik:v3.6
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/routes.yml
      - --ping=true
      - --accesslog=false
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./infra/traefik/routes.yml:/etc/traefik/routes.yml:ro,z"]
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
  seaweedfs-data:
