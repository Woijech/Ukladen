name: Ukladen Foundation CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: ukladen
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ukladen
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ukladen -d ukladen"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgresql+psycopg://ukladen:ci-only-password@localhost:5432/ukladen
      AUTH_TEST_REDIS_URL: redis://localhost:6379/15
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.11"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-test-results
          path: apps/web/test-results

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - name: Validate home tunnel configuration
        env:
          POSTGRES_PASSWORD: ci-only-password
          S3_ACCESS_KEY: ci-only-key
          S3_SECRET_KEY: ci-only-secret
          CLOUDFLARE_TUNNEL_TOKEN: ci-only-placeholder
        run: |
          cp .env.home.example .env.home
          docker compose --env-file .env.home -f docker-compose.yml -f docker-compose.home.yml config --format json | python3 infra/check_home_compose.py
      - run: docker compose up --build --detach --wait --wait-timeout 180
      - run: |
          curl --fail http://localhost:8080/api/health/live
          curl --fail http://localhost:8080/api/health/ready
          curl --fail http://localhost:8080/health
          docker compose exec -T worker celery -A app.workers.celery_app:celery_app inspect ping --timeout 5
      - if: failure()
        run: docker compose logs --no-color
      - if: always()
        run: docker compose down
