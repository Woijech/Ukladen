[project]
name = "ukladen-backend"
version = "0.1.0"
description = "Modular monolith foundation for Ukladen"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "httpx>=0.28,<1",
  "redis>=5,<8",
  "celery[redis]>=5.5,<6",
  "pwdlib[argon2]>=0.3,<1",
  "pyjwt[crypto]>=2.13,<3",
  "boto3>=1.43,<2",
  "pillow>=13,<14",
  "pypdf>=6.20,<7",
  "langchain==1.4.7",
  "langchain-core==1.6.13",
  "langgraph==1.2.16",
  "langgraph-checkpoint==4.3.0",
  "langgraph-checkpoint-postgres==3.2.0",
  "langsmith==0.14.12",
]

[dependency-groups]
dev = ["ruff>=0.9,<1", "pyright>=1.1,<2", "pytest>=8,<10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"
include = ["src", "tests", "alembic"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
