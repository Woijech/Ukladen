http:
  routers:
    api:
      entryPoints: [web]
      rule: "Host(`ukladen.app`) && PathPrefix(`/api`)"
      priority: 100
      service: api
    web:
      entryPoints: [web]
      rule: "Host(`ukladen.app`)"
      priority: 1
      service: web
  services:
    api:
      loadBalancer:
        servers:
          - url: http://api:8000
    web:
      loadBalancer:
        servers:
          - url: http://web:3000
